<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">The tape is the terminal — real pseudo-terminal recording</title>
<desc id="desc">Recorded 40 by 24 shell output from terminal.bf compiled to Brainfuck from Python: REAL SHELL / size: 24 40 / RED / xyCDE. Complete frames: 50. Run with python3 projects/terminal-in-brainfuck/run_terminal.py.</desc>
