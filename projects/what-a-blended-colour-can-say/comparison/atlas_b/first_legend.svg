<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="1600" viewBox="0 0 1040 1600" role="img" aria-labelledby="title desc">
<title id="title">Held-Out Comparison Set B: Probability-Interval Atlas</title>
<desc id="desc">Exact probability intervals, conservative byte observation intervals, and endpoint distributions beside each displayed swatch.</desc>
<style>text{font:16px sans-serif;fill:#172c3c}.title{font:bold 29px Georgia,serif}.heading{font:bold 19px sans-serif}.small{font:14px monospace}.label{font:bold 15px sans-serif}</style>
<rect width="1040" height="1600" fill="#f3f1e9"/>
<text x="30" y="43" class="title">Held-Out Comparison Set B: Probability-Interval Atlas</text>
<text x="30" y="76" class="">Linear-light blends. Opaque, flat sRGB swatches. Exact fractions are authoritative.</text>
<text x="30" y="105" class="">Byte ranges are conservative; percentages round outward. Distribution bars show exact-case endpoints.</text>
<text x="30" y="130" class="">linear8 is raw linear data: its hex preview is NOT equivalent displayed light. No reader study claimed.</text>
