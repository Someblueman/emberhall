<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="1740" viewBox="0 0 1040 1740" role="img" aria-labelledby="mode-title mode-desc">
<title id="mode-title">Second comparison A: probability atlas</title>
<desc id="mode-desc">Each row states its observation model, corresponding probability bounds, status and extremal distributions.</desc>
<style>[hidden]{display:none}text{font:16px sans-serif;fill:#172c3c}.heading{font:bold 20px sans-serif}.small{font:14px monospace}.label{font:bold 16px sans-serif}</style>
<rect width="1040" height="1740" fill="#f3f1e9"/>
<text x="30" y="40" class="heading">Second comparison A: probability atlas</text>
<text x="30" y="74" class="">One observation model per row. The bounds, status and distributions all belong to that model.</text>
<text x="30" y="103" class="">Rounded models use closed conservative boxes; exact fractions in certificates are authoritative.</text>
<g data-case="0" data-mode="exact" data-query="exact">
<rect x="18" y="140" width="1004" height="306" rx="10" fill="white"/>
<text x="34" y="170" class="heading">V2-1A / Observation 1A</text>
<text x="34" y="200" class="label">Exact linear-light colour</text>
<text x="34" y="234" class="heading">P(L4, L5) [9/20, 9/20] / EXACT</text>
<rect x="34" y="258" width="92" height="72" fill="#b7ae98" stroke="#526776"/>
<text x="144" y="282" class="">Displayed sRGB: #b7ae98</text>
<text x="144" y="312" class="small">linear8 bytes are data, not displayed light.</text>
<text x="34" y="372" class="small">EXACT: one value; BOUNDED: a restricted interval.</text>
<text x="34" y="398" class="small">UNIDENTIFIABLE: any probability from 0 to 1.</text>
<text x="552" y="200" class="label">exact: lower / upper endpoint distributions</text>
<rect x="552.00000" y="225" width="82.00000" height="22" fill="#4763e1"/><rect x="634.00000" y="225" width="143.50000" height="22" fill="#78e998"/><rect x="777.50000" y="225" width="184.50000" height="22" fill="#f08963"/><text x="552" y="267" class="small">1: 20.00%  2: 35.00%  4: 45.00%</text>
<rect x="552.00000" y="311" width="82.00000" height="22" fill="#4763e1"/><rect x="634.00000" y="311" width="143.50000" height="22" fill="#78e998"/><rect x="777.50000" y="311" width="184.50000" height="22" fill="#f08963"/><text x="552" y="353" class="small">1: 20.00%  2: 35.00%  4: 45.00%</text>
<text x="552" y="400" class="small">Labels: stop number : rounded probability</text>
<text x="552" y="423" class="small">Exact weights: cards and rational certificates</text>
</g>
