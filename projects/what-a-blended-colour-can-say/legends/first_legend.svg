<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="3340" viewBox="0 0 1040 3340" role="img" aria-labelledby="mode-title mode-desc">
<title id="mode-title">What a Blended Colour Can Say</title>
<desc id="mode-desc">Each row states its observation model, corresponding probability bounds, status and extremal distributions.</desc>
<style>[hidden]{display:none}text{font:16px sans-serif;fill:#172c3c}.heading{font:bold 20px sans-serif}.small{font:14px monospace}.label{font:bold 16px sans-serif}</style>
<rect width="1040" height="3340" fill="#f3f1e9"/>
<text x="30" y="40" class="heading">What a Blended Colour Can Say</text>
<text x="30" y="74" class="">One observation model per row. The bounds, status and distributions all belong to that model.</text>
<text x="30" y="103" class="">Rounded models use closed conservative boxes; exact fractions in certificates are authoritative.</text>
<g data-case="0" data-mode="srgb8" data-query="srgb8">
<rect x="18" y="140" width="1004" height="306" rx="10" fill="white"/>
<text x="34" y="170" class="heading">S1 / 2-Colour Blend (1:3)</text>
<text x="34" y="200" class="label">srgb8 observation #d89e91 (conservative outer box)</text>
<text x="34" y="234" class="heading">P(High) [74.41%, 75.04%] / BOUNDED</text>
<rect x="34" y="258" width="92" height="72" fill="#d89e91" stroke="#526776"/>
<text x="144" y="282" class="">Displayed sRGB: #d89e91</text>
<text x="144" y="312" class="small">linear8 bytes are data, not displayed light.</text>
<text x="34" y="372" class="small">EXACT: one value; BOUNDED: a restricted interval.</text>
<text x="34" y="398" class="small">UNIDENTIFIABLE: any probability from 0 to 1.</text>
<text x="552" y="200" class="label">srgb8: lower / upper endpoint distributions</text>
<rect x="552.00000" y="225" width="104.90072" height="22" fill="#6389e1"/><rect x="656.90072" y="225" width="305.09928" height="22" fill="#f0a563"/><text x="552" y="267" class="small">1: 25.59%  2: 74.41%</text>
<rect x="552.00000" y="311" width="102.34702" height="22" fill="#6389e1"/><rect x="654.34702" y="311" width="307.65298" height="22" fill="#f0a563"/><text x="552" y="353" class="small">1: 24.96%  2: 75.04%</text>
<text x="552" y="400" class="small">Labels: stop number : rounded probability</text>
<text x="552" y="423" class="small">Exact weights: cards and rational certificates</text>
</g>
