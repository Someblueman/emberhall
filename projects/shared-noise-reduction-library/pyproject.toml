[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "covreduce"
description = "First-order covariance propagation over labelled arrays with shared primitive sources"
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["version"]
dependencies = []

[tool.setuptools]
packages = ["covreduce"]

[tool.setuptools.dynamic]
version = { attr = "covreduce.__version__" }
